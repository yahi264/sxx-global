      <a href="#/" class="logo" id="logo" aria-label="SXX Global"></a>
      <nav class="nav" id="nav"></nav>
      <div class="hdr-act">
        <button class="ai-pill" id="aiPill" data-ai></button>
        <div class="lang" id="lang">

          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

    <div class="ai-sug" id="aiSug"></div>
    <form class="ai-in" id="aiForm"><input id="aiText" autocomplete="off" aria-label="Message"><button aria-label="Send"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></form>
